[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-collocations"
version = "0.1.0"
description = "Evidence-first, dependency-based contrastive collocation research engine"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.4,<2", "pyarrow>=19,<26", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
corpus = ["spacy>=3.8,<3.9", "en-core-web-sm"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
truth-collocations = "collocations.cli:main"

[tool.setuptools.packages.find]
include = ["collocations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
